[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcf"
version = "0.2.0"
description = "Fashion Content Factory v2 — multi-channel generative content pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0.30,<3",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "fastapi>=0.111,<0.120",
  "uvicorn>=0.30",
  "structlog>=24.1",
  "httpx>=0.27",
  "Pillow>=10.3",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]
live = ["anthropic>=0.28", "openai>=1.30", "replicate>=0.26", "boto3>=1.34", "arq>=0.26", "redis>=5,<6", "langgraph>=0.2", "langgraph-checkpoint-postgres>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
